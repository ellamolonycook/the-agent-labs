<style>
  :root{
    --bg:#0b0b10;
    --text:#f2f2f4;
    --lime:#d4ff4f;
    --line:rgba(255,255,255,.09);
    --display:"Space Grotesk", system-ui, -apple-system, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:var(--lime);color:#0b0b10}

  /* faint grid ground */
  .grid{
    position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
    opacity:.55;
  }
  /* lime bloom behind the type */
  .bloom{
    position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
    width:min(78vw,720px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle, rgba(212,255,79,.10) 0%, rgba(212,255,79,0) 68%);
    pointer-events:none;
  }

  main{
    position:relative;z-index:1;
    min-height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:32px 24px;
    text-align:center;
  }

  .wordmark{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(11px,2.4vw,13px);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--lime);
    margin-bottom:clamp(28px,7vh,64px);
    padding-left:.42em; /* optical: offset trailing letter-spacing */
  }

  .type-line{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(38px,9.5vw,104px);
    line-height:1.05;
    letter-spacing:-.02em;
    min-height:1.05em;
    white-space:nowrap;
  }

  .cursor{
    display:inline-block;
    width:.075em;height:.82em;
    margin-left:.06em;
    background:var(--lime);
    vertical-align:-.06em;
    animation:blink 1.06s steps(1,end) infinite;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  .sub{
    margin-top:clamp(22px,5vh,40px);
    font-size:clamp(11px,2.2vw,13px);
    letter-spacing:.24em;
    text-transform:uppercase;
    color:rgba(242,242,244,.42);
    opacity:0;
    transition:opacity .9s ease;
  }
  .sub.in{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;opacity:1}
    .sub{transition:none}
  }
</style>

<div class="grid" aria-hidden="true"></div>
<div class="bloom" aria-hidden="true"></div>

<main>
  <div class="wordmark">The Agent Labs</div>

  <h1 class="type-line">
    <span id="typed">Coming soon</span><span class="cursor" aria-hidden="true"></span>
  </h1>

  <p class="sub" id="sub">Back shortly</p>
</main>

<script>
(function(){
  var el = document.getElementById('typed');
  var sub = document.getElementById('sub');
  var text = 'Coming soon';
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduced) { sub.classList.add('in'); return; }

  el.textContent = '';
  var i = 0;
  function step(){
    if (i >= text.length) { setTimeout(function(){ sub.classList.add('in'); }, 420); return; }
    el.textContent += text.charAt(i);
    i++;
    var ch = text.charAt(i - 1);
    var delay = ch === ' ' ? 190 : 78 + Math.random() * 72;
    setTimeout(step, delay);
  }
  setTimeout(step, 620);
})();
</script>
